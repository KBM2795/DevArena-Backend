version: '3.8'

services:
  devarena-backend:
    build: .
    container_name: devarena-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - SERVER_PORT=8080
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_DBNAME=${DATABASE_DBNAME}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_GITHUB_PAT=${GITHUB_PAT}
      - CLERK_PEM_PUBLIC_KEY=${CLERK_PEM_PUBLIC_KEY}
      - CLERK_WEBHOOK_SIGNING_SECRET=${CLERK_WEBHOOK_SIGNING_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_CF_DOMAIN=${AWS_CF_DOMAIN}
      - AWS_CF_KEY_ID=${AWS_CF_KEY_ID}
      - AWS_CF_PRIVATE_KEY_PATH=/devarena-cf-signer.pem
    volumes:
      # CRITICAL: Allow backend to spawn sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: Align /tmp so host and container share the same path for cloned repos
      - /tmp:/tmp
      # CloudFront private key for signing video URLs
      - ./devarena-cf-signer.pem:/devarena-cf-signer.pem
      - ./config:/app/config
