version: '3.8'

services:
  devarena-backend:
    build: .
    container_name: devarena-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - SERVER_PORT=8080
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_DBNAME=devarena
      - DATABASE_SSLMODE=disable
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_GITHUB_PAT=${GITHUB_PAT}
      - CLERK_PEM_PUBLIC_KEY=${CLERK_PEM_PUBLIC_KEY}
      - CLERK_WEBHOOK_SIGNING_SECRET=${CLERK_WEBHOOK_SIGNING_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    volumes:
      # CRITICAL: Allow backend to spawn sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: Align /tmp so host and container share the same path for cloned repos
      - /tmp:/tmp
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: devarena-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devarena
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
